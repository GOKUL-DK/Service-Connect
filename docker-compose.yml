version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: serviceconnect_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: serviceconnect
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: serviceconnect_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/serviceconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
      DB_USER: "root"
      DB_PASSWORD: "root"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
